# ============================================================================
# scanlio 配置
#
# 加载方式：sad::Config cfg; cfg.LoadFromYaml("此文件路径", &err);
#           Frontend fe(cfg.ToFrontendOptions());
#           并在需要时调用 fe.SetInitCondition(cfg.init_bg, cfg.init_ba);
#
# 约定：
#   1. 缺省的键 → 使用代码内默认值；本文件写全了全部键，删掉某行即回到默认
#   2. 出现未知键 → 加载失败并报错（防止拼写错误静默失效）
#   3. 数值越界 → 加载失败（例如 min_pts_num < 3）
#
# 标注说明：
#   [实测] 有数据集实测依据      [默认] 沿用既有代码默认值，未单独实测
# ============================================================================

# ---------------------------------------------------------------------------
# 初始条件：阶段 1 静止标定的结果
# 注意：本项目 CSV 中 accel 字段已扣除重力，ba 是去重力后的线性加速度零偏
# ---------------------------------------------------------------------------
init:
  bg: 0.005403        # [实测] 陀螺 z 轴零偏，rad/s（imu_bias.txt；133.7 s 静止）
  ba_x: -0.186        # [实测] 加计 x 轴零偏，m/s^2
  ba_y: 0.054         # [实测] 加计 y 轴零偏，m/s^2

# ---------------------------------------------------------------------------
# 滤波（ESKF）
# Q 语义：*_var 直接作为「每步方差」填入，不乘 dt；lidar_*_noise 是标准差，使用时平方
# ---------------------------------------------------------------------------
eskf:
  gyro_var: 1.0e-6          # [默认] 陀螺角速度过程噪声方差，(rad/s)^2 / 步
  acce_var: 1.0e-3          # [默认] 加计比力过程噪声方差，(m/s^2)^2 / 步
  bias_gyro_var: 1.430343e-05  # [实测] 陀螺零偏随机游走方差，每步
                               #        来源 doc/eskf_noise_params.yaml：bias_gyro_rw_std 3.783749e-02 → 每步 1.430343e-05
  bias_acce_var: 9.253627e-05  # [实测] 加计零偏随机游走方差，每步
                               #        来源同上：bias_acce_rw_std 9.624057e-02 → 每步 9.253627e-05
  odom_var: 0.1             # [默认] 轮速观测噪声方差，(m/s)^2；偏大=不信任轮速
  lidar_pos_noise: 0.05     # [默认] 雷达位姿观测位置标准差，m；x/y 共用
  lidar_ang_noise: 0.1      # [默认] 雷达位姿观测角度标准差，rad
  # 原 imu_dt 已删除（2026-10-29 修复 S-03）：Predict 的 dt 由相邻 IMU 时间戳相减得出，
  # 该键从未被读取，保留会让使用者误以为改动生效。

# ---------------------------------------------------------------------------
# 迭代滤波（IESKF2D）：紧耦合路径
#
# 语义：本段所有 *_std 键是「标准差」，代码内部平方成方差后填入 Q 与观测噪声。
#       注意与上面 eskf 段相反 —— eskf 段的 *_var 键直接作方差使用。
#       两段不共用数值，不要照抄。
#
# 默认值与 eskf 段对应方差的算术平方根一致，便于两条路径在同等噪声设定下对照：
#   gyro_std       = sqrt(gyro_var)       = sqrt(1.0e-6)      = 0.001
#   acce_std       = sqrt(acce_var)       = sqrt(1.0e-3)      ≈ 0.0316228
#   bias_gyro_std  = sqrt(bias_gyro_var)  = sqrt(1.430343e-5) ≈ 0.00378209
#   bias_acce_std  = sqrt(bias_acce_var)  = sqrt(9.253627e-5) ≈ 0.00961957
#   odom_std       = sqrt(odom_var)       = sqrt(0.1)         ≈ 0.316228
#
# 仅在 frontend.filter_type 为 ieskf 时生效；为 eskf 时本段不参与计算。
#
# [实测 2026-10-31] 下面三项沿用 NdtLIO 原版取值（num_iterations 3 / eps 1e-3 /
# info_ratio 0.01）。本项目体素信息矩阵 Ω = (Σ + 1e-3·I)^-1 与原版的
# (Σ + normalizing_factor·I)^-1 量级不同：合成墙面实测 H 对角为
# 位置 x 8e3、位置 y 2e5、角度 1.1e6，角度项比位置项大 137 倍。
# 后果是紧耦合的角度修正强、位置修正弱，在长走廊末段与松耦合路径分歧明显
# （line 数据集：松耦合终点 1.903 m，紧耦合 3.325 m）。
# 该分歧无法判定孰优孰劣 —— 现有数据缺真值，且分歧段恰是几何退化 + 加速段。
# 切换后若需在实机上使用，这三项必须在有真值的数据上重新标定。
# ---------------------------------------------------------------------------
ieskf:
  gyro_std: 0.001                 # 陀螺角速度标准差，(rad/s)
  acce_std: 0.0316228             # 加计比力标准差，(m/s^2)
  bias_gyro_std: 0.00378209       # 陀螺零偏随机游走标准差
  bias_acce_std: 0.00961957       # 加计零偏随机游走标准差
  odom_std: 0.316228              # 轮速观测标准差，(m/s)
  num_iterations: 3               # 测量更新内的最大迭代次数
  eps: 0.001                      # 迭代收敛判据：增量范数阈值
  info_ratio: 0.01                # 逐点信息矩阵的整体缩放因子
  update_bias_gyro: true          # 是否注入陀螺零偏修正
  update_bias_acce: true          # 是否注入加计零偏修正

# ---------------------------------------------------------------------------
# 配准与地图（NDT）
# ---------------------------------------------------------------------------
ndt:
  voxel_size: 0.65          # [默认] 体素边长，m
  min_pts_num: 3            # [实测] 体素生效所需最少点数。取 10 会导致大部分格子长期不生效
                            #        （N10 约 444 点/圈、0.65 m 格约 7 点/格），配准假收敛 2.38°
  max_pts_num: 50           # [默认] 体素累计点数上限，超过后冻结（不再接受新点）
  max_capacity: 10000       # [默认] 体素数量上限，LRU 淘汰最久未更新者
  max_iteration: 50         # [默认] 配准最大迭代次数
  eps: 1.0e-3               # [默认] 迭代收敛判据（位移增量阈值）
  res_outlier_th: 5.991     # [实测] 卡方剔除阈值（2 自由度 95% 置信）；超限的匹配点被剔除
  use_svd_inverse: false    # [实测] true=SVD 稳健求逆；false=旧正则化 (Σ+λI)^-1
                            #        四配置对照：SVD 使转弯场景跳变 0→6~16，故默认 false

# ---------------------------------------------------------------------------
# 占据栅格（显示与导出用，不参与配准）
# ---------------------------------------------------------------------------
map:
  occupancy_resolution: 0.1   # [默认] 占据栅格边长，m。与 ndt.voxel_size 相互独立

# ---------------------------------------------------------------------------
# 前端调度
# ---------------------------------------------------------------------------
frontend:
  keyframe_dist_th: 0.1           # [默认] 关键帧判定的平移阈值，m
  keyframe_rot_th_deg: 15.0       # [默认] 关键帧判定的旋转阈值，度（结构体内转为弧度）
  imu_buffer_size: 20             # [默认] IMU 预测位姿缓冲容量。约 0.2 s，对 0.1 s 一帧留一倍余量
  use_filtered_pose_for_map: true # [待定] true=用滤波后位姿入图（对齐原版）；false=用配准位姿
                                  #        两者差别 = (I-K)×配准残差，待上机数据判定
                                  #        仅在 filter_type=eskf 时产生分支；ieskf 下配准与滤波是同一件事
  enable_undistort: true          # [实测] 雷达去畸变总开关
  filter_type: eskf               # [默认] 滤波器路由：eskf（松耦合，默认，行为不变）| ieskf（紧耦合）
                                  #        两条路径并列存在，切换只改此项，不改代码
